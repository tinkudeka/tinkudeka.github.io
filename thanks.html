<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Sent!</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0f14;
      color: #e8e8f0;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .box {
      background: #1a1e28;
      border: 1px solid #2a2f40;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 480px;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; margin-bottom: 1rem; color: #e8a838; }
    p  { color: #8888aa; margin-bottom: 2rem; line-height: 1.7; }
    a  {
      background: #e8a838;
      color: #0d0f14;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>Message Sent!</h1>
    <p>Thank you for reaching out. I'll get back to you as soon as possible.</p>
    <a href="https://tinkudeka.github.io">← Back to Portfolio</a>
  </div>
</body>
</html>
